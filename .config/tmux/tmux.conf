set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @vim_navigator_mapping_left "M-Left M-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "M-Right M-l"
set -g @vim_navigator_mapping_up "M-Up M-k"
set -g @vim_navigator_mapping_down "M-Down M-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

set -g @vim_navigator_prefix_mapping_clear_screen ""

set -g mouse on

unbind C-b
set -g prefix M-q 
bind M-q send-prefix
 
bind ']' split-window -h -c "#{pane_current_path}" -p 70
bind '/' split-window -v -c "#{pane_current_path}" -p 75 
bind '[' split-window -hb -c "#{pane_current_path}" -p 30 
bind '-' kill-pane
unbind %
unbind '"'

set-option -sa terminal-overrides ",xterm*:Tc"

bind v new-window -c "#{pane_current_path}"
bind , previous-window
bind . next-window
bind r kill-window

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle 
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set-option -g default-shell "/bin/bash"
set-option -g default-command bash

run '~/.config/tmux/plugins/tpm/tpm'
